[plugin]
prepend_previewers = [
  { url = "*.csv", run = 'piper -- bat --color=always "$1"' },
  { url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { url = "*/", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
]
prepend_fetchers = [
  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
]

[opener]
extract = [
  { run = 'ouch d -y %s', desc = "Extract here with ouch" },
]
