set -g default-terminal "tmux-256color"
set-option -ga terminal-features 'xterm-256color:RGB'
set-option -ga terminal-overrides ',xterm-256color:RGB'

# action key
set -g repeat-time 0
set -g focus-events on
set -g mouse on

set-window-option -g mode-keys vi

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

#### basic settings
set -g status-justify "left"
#set -g mouse-select-pane
set-window-option -g mode-keys vi
set -g history-limit 64096

set -sg escape-time 10

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"
source ~/.config/tmux/keybindings.conf
source ~/.config/tmux/theme.conf
source ~/.config/tmux/utility.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @pomodoro_pause " ⏸︎ "
set -g @pomodoro_complete " ✔︎ "
set -g @pomodoro_toggle '-'
set -g @pomodoro_notifications 'on'
set -g @pomodoro_granularity 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'

# Reattach to user namespace
set -g default-command "reattach-to-user-namespace -l fish"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off
